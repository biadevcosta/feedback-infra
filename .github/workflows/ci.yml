name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # required to request the GitHub OIDC token

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

# SES addresses come from repository secrets (repo and logs are public, LGPD)
env:
  TF_VAR_ses_sender_email: ${{ secrets.SES_SENDER_EMAIL }}
  TF_VAR_admin_emails: ${{ secrets.ADMIN_EMAILS }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # explicit bash adds pipefail: a terraform error before "| tee" fails the step
    steps:
      - uses: actions/checkout@v7

      # Secrets are masked only as whole strings; mask each address on its own too,
      # since they show up individually in the plan output
      - name: Mask emails
        run: |
          echo "::add-mask::$TF_VAR_ses_sender_email"
          for e in $(jq -r '.[]' <<< "$TF_VAR_admin_emails"); do echo "::add-mask::$e"; done

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: sa-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -lock=false | tee plan.txt
          {
            echo "## Terraform plan"
            echo '```'
            grep -E '^\s+# |^Plan:|^No changes' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
